# Fly.io config for the eBay scraper service
app = "gridironcards-scraper"
primary_region = "iad"

[build]

[http_service]
  internal_port = 8000
  force_https    = true
  auto_stop_machines  = true
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type       = "requests"
    soft_limit = 1
    hard_limit = 2
