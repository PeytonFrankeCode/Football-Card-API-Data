name: Deploy Scraper to Cloud Run

on:
  push:
    branches: [main, claude/football-cards-api-aFQ3c]
    paths: ['scraper-service/**']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service:    gridironcards-scraper
          source:     ./scraper-service
          region:     us-central1
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          flags:      --allow-unauthenticated --min-instances=0 --max-instances=2 --memory=256Mi --timeout=60

      - name: Print service URL
        run: echo "Scraper live at ${{ steps.deploy.outputs.url }}"
